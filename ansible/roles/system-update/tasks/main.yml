---
- name: Update package cache (Debian/Ubuntu)
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Update package cache (RedHat/CentOS/AlmaLinux)
  yum:
    update_cache: yes
  when: ansible_os_family == "RedHat"

- name: Upgrade all packages (Debian/Ubuntu)
  apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes
  when: ansible_os_family == "Debian"

- name: Upgrade all packages (RedHat/CentOS/AlmaLinux)
  yum:
    name: '*'
    state: latest
  when: ansible_os_family == "RedHat"

- name: Install essential packages
  package:
    name:
      - curl
      - wget
      - vim
      - git
      - net-tools
      - telnet
      - htop
      - fail2ban
      - auditd
    state: present
